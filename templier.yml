# Templiér dev config — replaces the old dev.* watcher tasks that used to
# live in Taskfile.yml (dev.tailwind / dev.web / dev.sql / dev.go).
#
# Run with: go tool templier   (auto-detects this file in the repo root)
#
# The proxy/app addresses below mirror Taskfile.yml's env block
# (LIVE_RELOAD_PROXY_HOST/PORT and HOST/PORT). Templiér config has no env
# interpolation, so they're hardcoded here; `task dev` fails fast if the two
# drift (see the guard commands in Taskfile.yml).

# host:port for the Templiér proxy. NOTE: no scheme — Templiér validates this
# as hostname:port and rejects "http://..." here (unlike app.host below).
templier-host: "localhost:7331"

# null => plain HTTP (dev only)
tls: null

# How long to wait for the app server to come up while proxying.
# Generous because the app runs sqlite migrations on start.
proxy-timeout: 10s

# golangci-lint is not on PATH (it lives in ./bin and check.go owns linting),
# so Templiér's built-in lint is disabled — enabling it would only fail builds
# with "golangci-lint: executable file not found".
lint: false

# templ fmt -fail on .templ saves: Templiér logs a warning when a template
# isn't fmt-clean (fmt is enforced by check.go/fix.go; this is dev feedback only).
format: true

# Rebuild-path debounce after a file change. Custom watchers use their own
# 50ms default (Templiér hardcodes it), so this only governs Go rebuilds.
debounce: 256ms

log:
  # erronly (default) | verbose | debug
  level: verbose
  # Keep the console readable across app restarts.
  clear-on: restart
  print-js-debug-logs: false

compiler:
  # Dev build flags, matching the old dev-run.sh (-tags=noembed serves
  # web/static from disk with no-cache headers; build.go stays on embedded
  # assets for prod).
  tags: [noembed]
  gcflags: "all=-N -l"
  # no compiler.env needed: HOST/PORT/DB_MIGRATE_ON_START/LIVE_RELOAD_PROXY_*
  # come from Taskfile.yml's env block and are inherited by the app server.

app:
  # source root to watch
  dir-src-root: ./
  # main package dir (cmd/serve/main.go), relative to dir-src-root
  dir-cmd: ./cmd/serve
  # cwd for the app server process (it opens ./data/sqlite.db and web/static)
  dir-work: ./
  # app server address Templiér proxies to (env-only app: HOST/PORT from Taskfile)
  host: "http://localhost:8080"
  # no CLI flags — the app is env-only (lib/env)
  flags: ""

  # NOTE: no app.exclude. Everything that must never trigger a rebuild is
  # dropped from the watcher entirely via watcher-ignore below — app.exclude
  # would only be needed for paths that custom watchers must still see.

# paths dropped from the file watcher entirely (no events at all — huge/
# uninteresting trees, or output dirs that must never trigger anything).
watcher-ignore:
  - "**/node_modules/**"
  - "web/static/**" # JS/CSS bundler outputs (served from disk in noembed dev mode)
  - "db/generated/**" # sqlc output, regenerated by the sqlc watcher
  - "tmp/**"
  - ".git/**"
  - "bin/**" # golangci-lint + templ binaries
  - "data/**" # sqlite db + runtime data — writes must not rebuild the server

custom-watchers:
  # JS bundler (web/build.ts -> web/static/bundle.js + page-files/)
  # NOTE: cmds are wrapped in `sh -c '...'` — Templiér validates the first
  # word of each watcher cmd with exec.LookPath, and `cd` is a shell builtin
  # with no standalone binary on Linux.
  - name: "Bundle JS"
    cmd: "sh -c 'cd web && bun run build.ts'"
    include: ["web/**/*.ts"]
    fail-on-error: true # bundler errors are shown in the browser
    # static files are served from disk (noembed), so no Go rebuild — reload is enough
    requires: reload

  # Tailwind CSS (web/tailwind.css -> web/static/tailwind.css)
  - name: "Tailwind CSS"
    cmd: "sh -c 'cd web && bunx tailwindcss -i tailwind.css -o static/tailwind.css --minify --cwd .'"
    include: ["web/**/*.css"] # doublestar's ** matches zero dirs, so web/tailwind.css is covered
    fail-on-error: true
    requires: reload # same noembed reasoning as the JS watcher

  # sqlc (db/queries + db/migrations -> db/generated)
  - name: "sqlc"
    cmd: "sh -c 'cd db && go tool sqlc generate'"
    include: ["db/**/*.sql"]
    fail-on-error: true # sql errors are shown in the browser
    requires: rebuild # generated Go code changed -> server must be rebuilt
